name: Build

on:
  push:
    branches:
      - develop
      - main
      - "rc/**"
    tags:
      - "release_*"
  pull_request:
    branches:
      - develop
      - main
      - "rc/**"

jobs:
  build:
    # PR develop→main (и т.п.) дублирует push-билд ветки; CI только для feature PR.
    if: github.event_name != 'pull_request' || (github.head_ref != 'develop' && github.head_ref != 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # Те же дефолты, что в Dockerfile — сборка не требует секретов.
          # MapTiler в проде — runtime (MAPTILER_KEY в compose), не build-arg.
          VITE_USE_MOCK: "false"
          VITE_YANDEX_AD_BLOCK_ID: R-A-20290944-1
        run: npm run build
